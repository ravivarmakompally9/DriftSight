<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="DriftSight — satellite debris detection and ocean drift tracking for the MSC ELSA 3 nurdle spill. Prototype with simulated data." />
    <meta name="theme-color" content="#0B1B33" />
    <title>DriftSight — marine debris console</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Dosis:wght@600;700;800&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <script>
      // Paint the right theme before React mounts, so there is no flash and the
      // map never has to swap its basemap style mid-mount. Reads the same
      // persisted store key Zustand writes to.
      (function () {
        try {
          var raw = localStorage.getItem("ds-app");
          var t = (raw && JSON.parse(raw).state && JSON.parse(raw).state.theme) || "system";
          var dark = t === "dark" || (t === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
          document.documentElement.dataset.themePref = t;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
