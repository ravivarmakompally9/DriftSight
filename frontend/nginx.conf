server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Hashed build assets never change under the same name.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # The API lives in a sibling container; same-origin keeps CORS out of the way.
  location /api/ {
    proxy_pass http://api:8000/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }

  location /docs      { proxy_pass http://api:8000/docs; }
  location /redoc     { proxy_pass http://api:8000/redoc; }
  location /openapi.json { proxy_pass http://api:8000/openapi.json; }

  # Single-page app: every other path falls through to index.html
  location / {
    try_files $uri $uri/ /index.html;
  }
}
