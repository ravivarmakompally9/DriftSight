[pytest]
testpaths = tests
addopts = -q
filterwarnings =
    default
    # NumPy 2.x + Apple Accelerate raises this spuriously inside BLAS matmul.
    # It is a false positive; the numbers are asserted by the parity tests.
    ignore:invalid value encountered in matmul:RuntimeWarning
    ignore:divide by zero encountered in matmul:RuntimeWarning
    ignore:overflow encountered in matmul:RuntimeWarning
